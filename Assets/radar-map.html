<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Drizzle</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/proj4@2.15.0/dist/proj4.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { width: 100%; height: 100%; background: #0D1117; overflow: hidden;
  font-family: "Segoe UI Variable", "Segoe UI", sans-serif; color: #e0e0e0; }
#map { width: 100%; height: 100%; background: #0D1117; }
.leaflet-container { background: #0D1117 !important; }
.state-hit-area {
  pointer-events: all !important;
}
.leaflet-control-zoom {
  position: fixed !important;
  right: calc(env(safe-area-inset-right, 0px) + 10px) !important;
  left: auto !important;
  top: calc(50% + (env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) / 2) !important;
  transform: translateY(-50%) !important;
  z-index: 9000;
}
.leaflet-control-attribution { display: none !important; }

/* ── Floating toolbars ──────────────────────────────────────────── */
#toolbar {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 6px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
  z-index: 9000;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 8px;
  padding: 6px 10px; border-radius: 8px;
  min-height: 34px;
  overflow: hidden;
  background: rgba(30,30,46,0.82); border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  -webkit-app-region: drag;
}
#toolbar .title,
#regionTitle,
.tb {
  min-height: 22px;
  font-size: 12px;
  line-height: 1;
}
#toolbar .title {
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
}
#regionTitle {
  min-width: 0;
  text-align: center;
  color: #aaa;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
}
#regionName {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
#imageryType { white-space: pre; }
#toolbar .btns {
  -webkit-app-region: no-drag;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: max-content;
  gap: 2px;
  align-items: center;
}
.tb {
  padding: 4px 8px;
  border: none;
  border-radius: 4px;
  background: rgba(255,255,255,0.06);
  color: #ccc;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  overflow: hidden;
}
.tb .tb-icon {
  flex: 0 0 1.5em;
  width: 1.5em;
  text-align: center;
  line-height: 1;
}
.tb .tb-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tb:hover { background: rgba(255,255,255,0.12); color: #fff; }
.tb:active { background: rgba(0,120,212,0.4); }

#regionPicker {
  width: min(360px, calc(100% - 32px));
  max-height: calc(100% - 48px);
  margin: auto;
  padding: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  background: #1e1e2e;
  color: inherit;
  overflow-y: auto;
}
#regionPicker::backdrop { background: rgba(13,17,23,0.65); }
#pickerBack[hidden] { display: none; }
.picker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
#pickerTitle { margin-right: auto; font-size: 14px; }
#pickerChoices { display: grid; gap: 3px; }
#pickerChoices .tb {
  width: 100%;
  min-height: 36px;
  justify-content: flex-start;
  white-space: normal;
  text-align: left;
}
#pickerChoices .tb[aria-current="true"] { background: rgba(0,120,212,0.55); color: #fff; }

#bottombar {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
  z-index: 9000;
  display: grid;
  grid-template-columns: 1fr;
  row-gap: 4px;
  padding: 6px 10px; border-radius: 8px;
  overflow: hidden;
  background: rgba(30,30,46,0.82); border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
#regionBtns {
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 3px;
  flex-wrap: nowrap;
}
#regionBtns .lbl {
  flex: 0 0 auto;
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  margin-right: 4px;
}
.rb {
  flex: 0 0 auto;
  padding: 3px 6px;
  font-size: 11px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: #aaa;
  cursor: pointer;
}
#regionBtns.layout-3,
#regionBtns.layout-2 {
  display: grid;
  align-items: center;
  justify-items: stretch;
  gap: 4px;
}
#regionBtns.layout-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
#regionBtns.layout-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#regionBtns.layout-3 .lbl,
#regionBtns.layout-2 .lbl {
  grid-column: 1 / -1;
  margin-right: 0;
  text-align: center;
  justify-self: center;
}
#regionBtns.layout-3 .rb,
#regionBtns.layout-2 .rb {
  min-width: 0;
  width: 100%;
  text-align: center;
}
.rb:hover { background: rgba(255,255,255,0.1); color: #fff; }
.rb.active { background: rgba(0,120,212,0.7); color: #fff; }
#statusArea {
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  color: #888;
}
#statusText,
#cacheStatus,
#worldCoverage {
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Loading indicator ────────────────────────────────────────── */
#loadingText {
  display: none; position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%); z-index: 9001;
  font: 600 16px "Segoe UI Variable", "Segoe UI", sans-serif;
  color: rgba(255,255,255,0.6); letter-spacing: 1px;
}
/* ── State tooltip ──────────────────────────────────────────── */
.state-tooltip {
  background: rgba(30,30,46,0.92); color: #fff;
  border: 1px solid rgba(0,120,212,0.6); border-radius: 6px;
  padding: 4px 10px; font: 600 13px "Segoe UI", sans-serif;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

/* ── Mobile / touch overrides ───────────────────────────────── */
@media (max-width: 768px), (pointer: coarse) {
  #toolbar {
    padding: 6px 8px;
    column-gap: 4px;
  }
  #toolbar .title,
  #regionTitle,
  .tb {
    font-size: 11px;
  }
  .tb { padding: 4px 7px; }
  .tb .tb-icon { flex-basis: 1.35em; width: 1.35em; }
  #bottombar {
    left: calc(env(safe-area-inset-left, 0px) + 6px);
    right: calc(env(safe-area-inset-right, 0px) + 6px);
    padding: 6px 8px;
  }
  #regionBtns .lbl { font-size: 11px; margin-right: 2px; }
  .rb { padding: 4px 6px; font-size: 11px; min-width: 34px; }
  #statusArea { font-size: 11px; gap: 4px; }
  .leaflet-control-zoom a { width: 36px !important; height: 36px !important;
    line-height: 36px !important; font-size: 20px !important; }
}

/* Narrow widths: keep title/region on first row and buttons on second row. */
@media (max-width: 520px) {
  #toolbar {
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-areas:
      "title region"
      "btns btns";
    row-gap: 4px;
  }
  #toolbar .title { grid-area: title; }
  #regionTitle { grid-area: region; justify-content: flex-start; text-align: left; }
  #toolbar .btns {
    grid-area: btns;
    width: 100%;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-flow: row;
    grid-auto-columns: initial;
  }
  .tb {
    width: 100%;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    justify-content: flex-start;
  }
  .tb .tb-icon { flex: 0 0 1.2em; width: 1.2em; }
}

/* Width pressure: tighten spacing/fonts but let JS choose 6-wide vs 3x2 vs 2x3. */
@media (max-width: 500px) {
  .rb {
    padding: 5px 8px;
  }
}

/* Extra-tight phones: keep text readable and clip long status text safely. */
@media (max-width: 360px) {
  #toolbar { padding: 4px 5px; row-gap: 3px; }
  #toolbar .title,
  #regionTitle,
  .tb { font-size: 10px; }
  .tb { padding: 4px 5px; min-height: 20px; }
  .tb .tb-icon { flex: 0 0 1.1em; width: 1.1em; }

  #bottombar {
    left: calc(env(safe-area-inset-left, 0px) + 4px);
    right: calc(env(safe-area-inset-right, 0px) + 4px);
    padding: 5px 6px;
  }
  #regionBtns { gap: 3px; }
  .rb { padding: 4px 6px; font-size: 11px; min-width: 0; }

  #statusArea {
    font-size: 10px;
    gap: 2px;
  }
  #statusText,
  #cacheStatus {
    flex: 1 1 100%;
    text-align: center;
  }
}

/* Keep long button labels on one line across DPI/font variants */
.tb, .rb, #toolbar .title, #regionTitle { line-height: 1.1; }
</style>
</head>
<body>

<!-- ── Floating top toolbar ──────────────────────────────────── -->
<div id="toolbar">
  <button id="imageryMode" class="title" type="button" aria-label="30-minute animation" aria-pressed="true" title="Switch to latest frame">30-minute</button>
  <span id="regionTitle"><span id="regionName">USA National</span><span id="imageryType"> — Radar</span></span>
  <div class="btns">
    <button id="regionSelector" class="tb" onclick="openRegionPicker()" aria-haspopup="dialog" aria-label="Choose region, USA selected" title="Choose region"><span class="tb-icon">🌎</span><span class="tb-label">USA</span></button>
    <button class="tb" onclick="refreshCurrent()" title="Re-download current radar"><span class="tb-icon">↻</span><span class="tb-label">Refresh</span></button>
    <button class="tb" onclick="clearCache()" title="Delete all cached GIFs"><span class="tb-icon">🗑</span><span class="tb-label">Cache</span></button>
  </div>
</div>

<dialog id="regionPicker" aria-labelledby="pickerTitle">
  <div class="picker-header">
    <button id="pickerBack" class="tb" type="button" onclick="showPickerGroups()">Back</button>
    <h2 id="pickerTitle">Choose region</h2>
    <button id="pickerClose" class="tb" type="button" onclick="regionPicker.close()">Close</button>
  </div>
  <div id="pickerChoices"></div>
</dialog>

<!-- ── Floating bottom bar ───────────────────────────────────── -->
<div id="bottombar">
  <div id="regionBtns" class="layout-6">
    <span class="lbl">Region</span>
  </div>
  <div id="statusArea">
    <span id="statusText">Ready</span>
    <span id="cacheStatus"></span>
    <span id="worldCoverage" hidden>Polar areas have no Sirocco imagery</span>
  </div>
</div>

<!-- ── Loading indicator ─────────────────────────────────────── -->
<div id="loadingText">Loading</div>

<!-- ── Map ────────────────────────────────────────────────────── -->
<div id="map"></div>

function resolveRadarUrl(region, type, animated) {
  const code = imagerySourceCode(region, type);
  if (type === 'radar') {
    return SIROCCO + 'nx_mosaic_640x480_public/sir/' + (animated ? 'inmasir' : 'inmsir') + code + '.gif';
  }
  const layer = type === 'sat_ei' ? 'ei' : 'ir';
  const prefix = (animated ? 'isa' : 'is') + (layer === 'ei' ? 'e' : '');
  return SIROCCO + 'sat_mosaic_640x480_public/' + layer + '/' + prefix + code + '.gif';
}

const RADAR_CACHE_PREFIX = window.RADAR_CACHE_PREFIX || 'https://radar-cache.local/';
const pendingDownloads = new Map();
if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener('message', ({ data }) => {
    if (data.type === 'radarReady' || data.type === 'radarError' || data.type === 'cacheLookup') {
      const id = data.type === 'cacheLookup' ? 'cache:' + data.key : data.key;
      const request = pendingDownloads.get(id);
      if (!request) return;
      pendingDownloads.delete(id);
      request.resolve({
        url: data.file ? RADAR_CACHE_PREFIX + data.file + '?t=' + data.time : null,
        cached: data.cached,
        time: new Date(data.time),
        status: data.status,
        error: data.error
      });
    } else if (data.type === 'cacheCleared') {
      setStatus('Cache cleared.');
      updateCacheStatus();
    } else if (data.type === 'cacheSize') {
      const kb = (data.bytes / 1024).toFixed(1);
      document.getElementById('cacheStatus').textContent = data.count + ' GIF' + (data.count !== 1 ? 's' : '') + ' \u00b7 ' + kb + ' KB';
    }
  });
}
function requestDownload(region, type, animated, cacheOnly = false) {
  // Keep corrected Canadian feeds separate from any cached Northern California GIFs.
  const code = region.sourceCodes?.[type] || region.code;
  const key = type + '_' + code + '_' + animated;
  const id = cacheOnly ? 'cache:' + key : key;
  const pending = pendingDownloads.get(id);
  if (pending) return pending.promise;
  let resolve;
  const promise = new Promise(done => { resolve = done; });
  pendingDownloads.set(id, { promise, resolve });
  if (cacheOnly) {
    window.chrome.webview.postMessage('LOOKUPCACHE|' + key);
  } else {
    const legacyKey = type === 'radar' && animated ? region.key || '' : '';
    window.chrome.webview.postMessage('DOWNLOAD|' + key + '|' + legacyKey + '|' + resolveRadarUrl(region, type, animated));
  }
  return promise;
}

async function fetchRadarGif(region, animated, request) {
  let type = region.type;
  let result = await requestDownload(region, type, animated);
  if (request !== selectionRequest) return null;
  if (!result.url && region.satelliteFallback) {
    type = 'sat_ei';
    result = await requestDownload(region, type, animated);
    if (request !== selectionRequest) return null;
  }
  if (!result.url && type === 'sat_ei') {
    const cacheOnly = result.status !== 404;
    const alternate = await requestDownload(region, 'sat_ir', animated, cacheOnly);
    if (alternate.url || !cacheOnly) {
      type = 'sat_ir';
      result = alternate;
    }
  }
  let displayedRegion = region;
  const fallback = region.state && !region.satelliteFallback && getRegionFallback(region.key);
  if (!result.url && fallback) {
    const alternate = await requestDownload(fallback, 'radar', animated);
    if (alternate.url) {
      result = alternate;
      displayedRegion = fallback;
      type = 'radar';
    }
  }
  return { ...result, displayedRegion, type };
}

function applyRegionButtonLayout() {
  const container = document.getElementById('regionBtns');
  if (!container) return;

  container.classList.remove('layout-2', 'layout-3', 'layout-6');
  container.classList.add('layout-6');

  const bottombar = document.getElementById('bottombar');
  if (!bottombar) return;

  const overflowsIn6 = container.scrollWidth > (container.clientWidth + 1);
  if (overflowsIn6) {
    container.classList.remove('layout-6');
    container.classList.add('layout-3');

    const overflowsIn3 = bottombar.scrollHeight > (bottombar.clientHeight + 1) ||
      container.scrollWidth > (container.clientWidth + 1);
    if (overflowsIn3) {
      container.classList.remove('layout-3');
      container.classList.add('layout-2');
    }
  }
}

function getMapFitPadding() {
  const zoom = document.querySelector('.leaflet-control-zoom');
  const toolbar = document.getElementById('toolbar');
  const bottombar = document.getElementById('bottombar');
  const rightInset = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('env(safe-area-inset-right)')) || 0;
  const leftInset = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('env(safe-area-inset-left)')) || 0;
  // Reserve space for the floating bars so the radar always sits between them,
  // even when they wrap onto extra rows on narrow/portrait screens.
  const topPad = Math.ceil((toolbar?.offsetHeight || 0) + 16);
  const bottomPad = Math.ceil((bottombar?.offsetHeight || 0) + 16);
  const rightPad = Math.ceil((zoom?.offsetWidth || 0) + rightInset + 16);
  const leftPad = Math.ceil(leftInset + 8);
  return {
    paddingTopLeft: [leftPad, topPad],
    paddingBottomRight: [rightPad, bottomPad]
  };
}

function relayoutMap() {
  map.invalidateSize(false);
  if (worldImagery) return;
  map.fitBounds(imageryBounds(displayedImagery?.displayedRegion), { animate:false, ...getMapFitPadding() });
}

function imageryBounds(region) {
  if (!region?.focus) return gifBounds;
  const [left, top, right, bottom] = region.focus;
  return [[IMG_H - bottom, left], [IMG_H - top, right]];
}

// Sirocco wmerc is a Pacific-centered spherical Mercator. The fit is shared
// by enhanced IR, standard IR and the loop. The raster covers ~66.5° S–N.
const WORLD_SEAM = 75.4;
const WORLD_EQUATOR_ROW = 240.16;
const WORLD_PIXELS_PER_MERCATOR_DEGREE = 2.6645;
const WORLD_QUANTIZATION = 8;
const WORLD_COPIES = [-2, -1, 0, 1, 2];
let worldImagery = null;
let worldCountries = null;

function worldY(latitude) {
  const mercatorLatitude = Math.min(85, Math.max(-85, latitude));
  const mercator = Math.asinh(Math.tan(mercatorLatitude * Math.PI / 180)) * 180 / Math.PI;
  const polarTail = (latitude - mercatorLatitude) * 2.2;
  return IMG_H - WORLD_EQUATOR_ROW + WORLD_PIXELS_PER_MERCATOR_DEGREE * (mercator + polarTail);
}

function projectWorldBounds([west, south, east, north]) {
  const x = ((west - WORLD_SEAM + 720) % 360) * IMG_W / 360;
  return [[worldY(south), x], [worldY(north), x + (east - west) * IMG_W / 360]];
}

function isWorldMosaic(region) {
  return region.sourceCode === 'wmerc';
}

function worldDetail(name, location) {
  const degrees = location.lng * 360 / IMG_W + WORLD_SEAM;
  const longitude = ((degrees + 180) % 360 + 360) % 360 - 180;
  if (name === 'United States') {
    if (location.lat >= worldY(51) && (longitude <= -129 || longitude >= 170)) {
      return regionsByCode.get('ak_');
    }
    if (longitude >= -163 && longitude <= -154 && location.lat < worldY(24)) {
      return regionsByCode.get('hi_');
    }
    return regionsByCode.get('conus');
  }
  if (name === 'Canada') return regionsByCode.get(location.lat > worldY(60) ? 'canadair' : 'can');
  if (name === 'Brazil' && location.lat < worldY(-25)) return regionsByCode.get('sams');
  if (name === 'France' && longitude < -45 && location.lat < worldY(25)) {
    return regionsByCode.get(location.lat < worldY(10) ? 'samn' : 'car');
  }
  return regionsByCode.get(detailByCountry.get(name));
}

function drillDownWorld(name, bounds, location) {
  return openDetail(worldDetail(name, location), () => focusWorld(name, bounds), name);
}

async function openDetail(target, focus, name) {
  if (!target) return focus();
  const overview = worldImagery ? {
    ...currentSelection, location:worldLocation, center:map.getCenter(), zoom:map.getZoom()
  } : worldOverview;
  const request = ++selectionRequest;
  detailRequest = request;
  showLoading();
  setStatus('Loading ' + target.region.name + '...');
  const result = await fetchRadarGif(target.region, animated, request);
  if (!result || request !== selectionRequest) return;
  detailRequest = 0;
  if (!result.url) {
    hideLoading();
    focus();
    setStatus(name + ' · Detailed imagery unavailable');
    return;
  }

  worldOverview = overview;
  return selectRegion(target.group, target.region, target.region.name, { prefetched:result });
}

function returnToWorld() {
  const overview = worldOverview;
  if (overview) return selectRegion(overview.group, overview.region, overview.name, { restore:overview });
}

function cancelDetailRequest() {
  if (!detailRequest || detailRequest !== selectionRequest) return;
  selectionRequest++;
  detailRequest = 0;
  hideLoading();
}

function updateWorldButtons() {
  for (const button of document.querySelectorAll('[data-world-location]')) {
    const active = button.dataset.worldLocation === (worldLocation || '');
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
  }
}

function worldCountryBounds(pieces, location, offset) {
  const part = pieces.find(box => box.contains(location)) || pieces[0];
  const joined = L.latLngBounds(part.getSouthWest(), part.getNorthEast());
  const touchesLeft = part.getWest() === offset;
  const touchesRight = part.getEast() === offset + IMG_W;
  if (touchesLeft === touchesRight) return joined;

  // Restore the other side of a country split at the raster seam.
  const shift = touchesLeft ? -IMG_W : IMG_W;
  for (const box of pieces) {
    const matchingEdge = touchesLeft ? box.getEast() === offset + IMG_W : box.getWest() === offset;
    if (matchingEdge && box.getNorth() >= part.getSouth() && box.getSouth() <= part.getNorth()) {
      joined.extend([box.getSouth(), box.getWest() + shift]);
      joined.extend([box.getNorth(), box.getEast() + shift]);
    }
  }
  return joined;
}

function focusWorld(name, bounds) {
  if (!worldImagery) return;
  cancelDetailRequest();
  worldLocation = name;
  updateWorldButtons();
  const nameAndType = displayedImagery?.type || world.type;
  setRegionTitle(name || currentSelection.name, nameAndType);
  setStatus((name || currentSelection.name) + ' · World imagery');
  const target = L.latLngBounds(bounds);
  const shift = Math.round((map.getCenter().lng - target.getCenter().lng) / IMG_W) * IMG_W;
  const { lat:south, lng:west } = target.getSouthWest();
  const { lat:north, lng:east } = target.getNorthEast();
  map.fitBounds([[south, west + shift], [north, east + shift]], {
    animate:false, maxZoom:3.5, ...getMapFitPadding()
  });
}

function decodeWorldPolygons(encoded, topOrigin = false) {
  const bytes = atob(encoded);
  let offset = 0;
  function read() {
    let value = 0, shift = 0, byte;
    do {
      byte = bytes.charCodeAt(offset++);
      value |= (byte & 127) << shift;
      shift += 7;
    } while (byte & 128);
    return value;
  }
  function delta() {
    const value = read();
    return (value >>> 1) ^ -(value & 1);
  }
  return Array.from({ length:read() }, () =>
    Array.from({ length:read() }, () => {
      let x = 0, y = 0;
      return Array.from({ length:read() }, () => {
        x += delta();
        y += delta();
        const row = y / WORLD_QUANTIZATION;
        return [topOrigin ? IMG_H - row : row, x / WORLD_QUANTIZATION];
      });
    })
  );
}

// ── Regional mosaic borders ────────────────────────────────────────────────
// Regional packs store image rows measured from the top of the raster.
let regionCountryData = null;
let regionBorderLayer = null;
let regionBorderKey = null;

function regionBordersFor(sourceCode) {
  regionCountryData ||= JSON.parse(document.getElementById('regionCountryData').textContent);
  const packed = regionCountryData[sourceCode];
  if (!packed) return null;
  if (!packed.decoded) {
    packed.decoded = packed.map(([name, polygons]) => [name, decodeWorldPolygons(polygons, true)]);
  }
  return packed.decoded;
}

function clearRegionBorders() {
  if (regionBorderLayer) { map.removeLayer(regionBorderLayer); regionBorderLayer = null; }
  regionBorderKey = null;
}

const countryFeeds = new Map([
  ['United States','conus'], ['Canada','can'], ['Mexico','mex'], ['Puerto Rico','pr_'],
  ['United Kingdom','uk'], ['Ireland','uk'], ['India','asias'],
  ['Australia','aus'], ['New Zealand','nz']
]);

function bindCountryInteraction(layer, name, select, normalStyle) {
  const tooltip = document.createElement('span');
  tooltip.textContent = name;
  layer.bindTooltip(tooltip, { className:'state-tooltip', sticky:true, direction:'top', offset:[0,-10] });
  layer.on('mouseover', () => layer.setStyle({
    stroke:true, color:'#a6d9ff', opacity:1, weight:1.5, fillColor:'#8ac3ea', fillOpacity:0.15
  }));
  layer.on('mouseout', () => layer.setStyle(normalStyle));
  layer.on('click', select);
}

function selectRegionalCountry(name, bounds, sourceCode) {
  const target = regionsByCode.get(countryFeeds.get(name));
  const localSource = target && imagerySourceCode(target.region, target.region.type);
  const focus = () => {
    cancelDetailRequest();
    const mosaic = currentSelection.region.name;
    currentSelection.name = name;
    setRegionTitle(name, displayedImagery.type);
    setStatus(name + ' · ' + mosaic);
    map.fitBounds(bounds, { animate:false, maxZoom:3.5, ...getMapFitPadding() });
  };
  const isLocalUSMosaic = name === 'United States' && (sourceCode === 'hi_' || sourceCode === 'ak_');
  if (localSource && localSource !== sourceCode && !isLocalUSMosaic
      && !Object.values(target.region.sourceCodes || {}).includes(sourceCode)) {
    return openDetail(target, focus, name);
  }
  focus();
}

function setRegionBorders(sourceCode) {
  if (regionBorderKey === sourceCode && regionBorderLayer) return true;
  const data = regionBordersFor(sourceCode);
  clearRegionBorders();
  if (!data) return false;
  const layers = L.layerGroup();
  const renderer = L.canvas({ pane:'hitPane' }).addTo(layers);
  const borderStyle = { stroke:true, color:'#9fb4c2', weight:0.75, opacity:0.38, fillOpacity:0 };
  for (const [name, parts] of data) {
    const bounds = parts.map(part => L.latLngBounds(part[0]));
    const hits = L.polygon(parts, {
      renderer, pane:'hitPane', fill:true, bubblingMouseEvents:false, ...borderStyle
    }).addTo(layers);
    bindCountryInteraction(hits, name, ({ latlng }) => {
      selectRegionalCountry(name, bounds.find(box => box.contains(latlng)) || bounds[0], sourceCode);
    }, borderStyle);
  }
  layers.addTo(map);
  regionBorderLayer = layers;
  regionBorderKey = sourceCode;
  return true;
}

function updateWorldViewport() {
  if (!worldImagery) return;
  const center = map.getCenter();
  const wrapped = ((center.lng % IMG_W) + IMG_W) % IMG_W;
  if (Math.abs(wrapped - center.lng) > IMG_W / 2) {
    map.setView([center.lat, wrapped], map.getZoom(), { animate:false });
  }
  const visible = map.getBounds();
  document.getElementById('worldCoverage').hidden = visible.getSouth() >= -12 && visible.getNorth() <= IMG_H + 12;
  if (map.getZoom() >= 2) worldImagery.smallCountries.addTo(map);
  else worldImagery.smallCountries.remove();
}
map.on('moveend', updateWorldViewport);

function setWorldPanBounds() {
  if (!worldImagery) return;
  const minimumScale = map.getZoomScale(map.getMinZoom(), 0);
  const padding = Math.max(48, map.getSize().y / (2 * minimumScale) - 80);
  map.setMaxBounds([[worldY(-90) - padding, -2 * IMG_W], [worldY(90) + padding, 3 * IMG_W]]);
}
map.on('resize', setWorldPanBounds);

function setWorldImagery(url) {
  if (worldImagery) {
    worldImagery.images.forEach(image => image.setUrl(url));
    return;
  }
  clearRegionBorders();
  worldCountries ||= JSON.parse(document.getElementById('worldCountryData').textContent)
    .map(([name, polygons]) => [name, decodeWorldPolygons(polygons)]);

  const layers = L.layerGroup().addTo(map);
  const smallCountries = L.layerGroup();
  const baseRenderer = L.canvas({ pane:'worldBasePane' }).addTo(layers);
  const hitRenderer = L.canvas({ pane:'hitPane' }).addTo(layers);
  const images = [];
  for (const copy of WORLD_COPIES) {
    const offset = copy * IMG_W;
    const image = L.imageOverlay(url, [[0, offset], [IMG_H, offset + IMG_W]], {
      interactive:false, pane:'radarPane'
    }).addTo(layers);
    images.push(image);
    for (const [name, parts] of worldCountries) {
      const shifted = parts.map(poly => poly.map(ring => ring.map(([y,x]) => [y, x + offset])));
      L.polygon(shifted, {
        renderer:baseRenderer, pane:'worldBasePane', interactive:false,
        color:'#687985', weight:0.75, fillColor:'#3a454d', fillOpacity:1
      }).addTo(layers);

      const bounds = shifted.map(poly => L.latLngBounds(poly[0]));
      const hits = L.polygon(shifted, {
        renderer:hitRenderer, pane:'hitPane', stroke:false, fill:true, fillOpacity:0, bubblingMouseEvents:false
      }).addTo(layers);
      bindCountryInteraction(hits, name, ({ latlng }) => {
        drillDownWorld(name, worldCountryBounds(bounds, latlng, offset), latlng);
      }, { stroke:false, fillOpacity:0 });

      const size = box => Math.max(box.getEast() - box.getWest(), box.getNorth() - box.getSouth());
      const largest = bounds.reduce((a, b) => size(b) > size(a) ? b : a);
      if (size(largest) < 2) {
        L.circleMarker(largest.getCenter(), {
          renderer:hitRenderer, pane:'hitPane', radius:4, weight:1, color:'#a6d9ff',
          fillColor:'#263c52', fillOpacity:0.8, bubblingMouseEvents:false
        }).bindTooltip(name, { className:'state-tooltip', direction:'top' })
          .on('click', () => drillDownWorld(name, largest, largest.getCenter())).addTo(smallCountries);
      }
    }
    for (const y of [0, IMG_H]) {
      L.polyline([[y, offset], [y, offset + IMG_W]], {
        renderer:hitRenderer, pane:'hitPane', interactive:false, color:'#8ca7be', opacity:0.65, weight:1
      }).addTo(layers);
    }
  }
  worldImagery = { layers, images, smallCountries };
  setWorldPanBounds();
  updateWorldViewport();
}

function clearWorldImagery() {
  if (!worldImagery) return;
  worldImagery.smallCountries.remove();
  worldImagery.layers.remove();
  worldImagery = null;
  worldLocation = null;
  document.getElementById('worldCoverage').hidden = true;
  map.setMaxBounds(regionalMaxBounds);
}

// ── LCC projection
const LCC_PARAMS = { lat_0: 37.8, lon_0: -97.4, lat_1: 89.0, lat_2: 89.0 };
function buildLCC() {
  return '+proj=lcc +lat_0=' + LCC_PARAMS.lat_0 + ' +lon_0=' + LCC_PARAMS.lon_0
    + ' +lat_1=' + LCC_PARAMS.lat_1 + ' +lat_2=' + LCC_PARAMS.lat_2
    + ' +a=6371200 +b=6371200 +units=m +no_defs';
}
let LCC = buildLCC();
const WGS = 'EPSG:4326';

let ROTATION_DEG = 0.7;
const PROJ = { left: -3780000, right: 3750000, top: 3135000, bottom: -2585000 };
let PROJ_W = PROJ.right - PROJ.left;
let PROJ_H = PROJ.top - PROJ.bottom;

function geoToPixel(lng, lat) {
  let [x, y] = proj4(WGS, LCC, [lng, lat]);
  if (ROTATION_DEG !== 0) {
    const cx = (PROJ.left + PROJ.right) / 2, cy = (PROJ.top + PROJ.bottom) / 2;
    const rad = ROTATION_DEG * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const dx = x - cx, dy = y - cy;
    x = cx + dx * cos - dy * sin;
    y = cy + dx * sin + dy * cos;
  }
  return [(y - PROJ.bottom) / PROJ_H * IMG_H, (x - PROJ.left) / PROJ_W * IMG_W];
}

}

function geoToPixelRegion(lng, lat, rp) {
  const lcc = '+proj=lcc +lat_0='+rp.lat_0+' +lon_0='+rp.lon_0+' +lat_1='+rp.lat_1+' +lat_2='+rp.lat_2+' +a=6371200 +b=6371200 +units=m +no_defs';
  let [x, y] = proj4('EPSG:4326', lcc, [lng, lat]);
  if (rp.rotation !== 0) {
    const cx=(rp.left+rp.right)/2, cy=(rp.top+rp.bottom)/2, rad=rp.rotation*Math.PI/180;
    const cos=Math.cos(rad), sin=Math.sin(rad), dx=x-cx, dy=y-cy;
    x=cx+dx*cos-dy*sin; y=cy+dx*sin+dy*cos;
  }
  const pw=rp.right-rp.left, ph=rp.top-rp.bottom;
  let px=(x-rp.left)/pw*IMG_W, py=(y-rp.bottom)/ph*IMG_H;
  px=(px-IMG_W/2)*rp.scale+IMG_W/2+rp.offX;
  py=(py-IMG_H/2)*rp.scale+IMG_H/2+rp.offY;
  return [py, px];
}

function setBaseImagery(url) {
  clearRegionBorders();

  nationalOverlay = L.imageOverlay(url, gifBounds, { opacity:1, interactive:false, pane:'radarPane' });
  nationalOverlay.addTo(map);
}

function setNationalRadar(url) {
  setBaseImagery(url);
  if (!statesLayer || _stateViewActive || _regionViewActive) {
    _stateViewActive = false; _regionViewActive = false;
    rebuildPolygons(geoToPixel);
  }
  if (statesLayer) statesLayer.bringToFront();
}

function setRegionRadar(url, regionKey) {
  setBaseImagery(url);
  _stateViewActive = false;
  _regionViewActive = true;
  if (!regionCalibMap[regionKey]) regionCalibMap[regionKey] = makeDefaultRegionCalib();
  applyRegionProjection(regionCalibMap[regionKey]);
}

function applyRegionProjection(rp) { rebuildPolygons(function(lng,lat){ return geoToPixelRegion(lng,lat,rp); }); }

const stateBoundsMap = {};
const subRegionBounds = {};
function initSubRegionBounds() {
  const ca=stateBoundsMap['CA'], tx=stateBoundsMap['TX'];
  if(ca){subRegionBounds['NORCAL']=ca;subRegionBounds['CENTRALCAL']=ca;subRegionBounds['SOCAL']=ca;}
  if(tx){subRegionBounds['SOUTHCENTRAL']=tx;subRegionBounds['TXW']=tx;subRegionBounds['TXE']=tx;subRegionBounds['TXS']=tx;}
}

function setStateRadar(url, abbrev) {
  let sb = stateBoundsMap[abbrev] || subRegionBounds[abbrev];
  if (!sb) { setUnprojectedImagery(url); return; }
  _stateViewActive = true;
  if (nationalOverlay) nationalOverlay.setOpacity(0);
  if (stateOverlay) map.removeLayer(stateOverlay);
  stateOverlay = L.imageOverlay(url, gifBounds, { opacity:1, interactive:false, pane:'radarPane' });
  stateOverlay.addTo(map);
  _stateViewCenter = { lat:(sb.minLat+sb.maxLat)/2, lng:(sb.minLng+sb.maxLng)/2 };
  const cosLat = Math.cos(_stateViewCenter.lat * Math.PI / 180);
  const geoW = (sb.maxLng - sb.minLng) * cosLat * 2.3;
  const geoH = (sb.maxLat - sb.minLat) * 2.3;
  _stateViewBaseScale = IMG_H / (geoW/geoH > 4/3 ? geoW*3/4 : geoH);
  const calib = stateCalibMap[abbrev] || { scale:1, offX:0, offY:0 };
  applyStateProjection(calib);
}

function applyStateProjection(calib) {
  const scale = _stateViewBaseScale * calib.scale, offX = calib.offX||0, offY = calib.offY||0;
  const center = _stateViewCenter;
  rebuildPolygons(function(lng, lat) {
    const cosLat = Math.cos(center.lat * Math.PI / 180);
    return [
      (lat - center.lat) * scale + IMG_H / 2 + offY,
      (lng - center.lng) * scale * cosLat + IMG_W / 2 + offX
    ];
  });
}

function removeStateHitAreas() {
  if (statesLayer) map.removeLayer(statesLayer);
  statesLayer = null;
  _stateViewActive = false;
  _regionViewActive = false;
}

function setUnprojectedImagery(url, region, type) {
  setBaseImagery(url);
  removeStateHitAreas();
  const sourceCode = region && imagerySourceCode(region, type);
  if (!sourceCode || !setRegionBorders(sourceCode)) clearRegionBorders();
}

let _lastTouchSelectionAt = 0;
const defaultStyle = {
  color:'#fff',
  opacity:0.001,
  weight:1,
  fillColor:'#fff',
  fillOpacity:0.001,
  className:'state-hit-area'
};

function bindFeatureInteraction(feature, layer) {
  const abbrev = feature.properties.STUSPS || '';
  const name = feature.properties.NAME || feature.properties.name || abbrev;
  if (abbrev && feature.properties._geoBounds) stateBoundsMap[abbrev] = feature.properties._geoBounds;
  let touchStartPoint = null;
  let touchActive = false;

  function selectFromEvent(e) {
    let clickAbbrev = abbrev, clickName = name;
    if (subFn && e && e.latlng) {
      const r = getRelPos(layer, e.latlng);
      const sub = subFn(r.x, r.y);
      clickAbbrev = sub.key;
      clickName = sub.name;
    }
    handleStateClick(clickAbbrev, clickName);
  }

  const subFn = _subRegionConfig[abbrev];
  if (subFn) {
    layer.bindTooltip('', { className:'state-tooltip', sticky:true, direction:'top', offset:[0,-10] });
    layer.on('mousemove', e => { const r=getRelPos(layer,e.latlng); layer.setTooltipContent(subFn(r.x,r.y).name); });
  } else {
    const tip = _stateRedirect[abbrev] ? name+' \u2192 '+_stateRedirect[abbrev]
      : name+(abbrev?' ('+abbrev+')':'');
    if (tip) layer.bindTooltip(tip, { className:'state-tooltip', sticky:true, direction:'top', offset:[0,-10] });
  }
  layer.on('touchstart', function(e) {
    touchActive = true;
    touchStartPoint = e.latlng ? map.latLngToContainerPoint(e.latlng) : null;
  });
  layer.on('touchend', function(e) {
    if (!touchActive) return;
    touchActive = false;
    const endPoint = e.latlng ? map.latLngToContainerPoint(e.latlng) : null;
    if (touchStartPoint && endPoint && touchStartPoint.distanceTo(endPoint) > 16) return;
    _lastTouchSelectionAt = Date.now();
    selectFromEvent(e);
  });
  layer.on('touchcancel', function() {
    touchActive = false;
    touchStartPoint = null;
  });
  layer.on('click', function(e) {
    if (Date.now() - _lastTouchSelectionAt < 750) return;
    selectFromEvent(e);
  });
}

function handleStateClick(abbrev, name) {
  if (currentSelection.group !== usa) return;
  const redirect = _stateRedirect[abbrev];
  const region = usByKey.get(redirect || abbrev);
  if (!region) return;
  selectRegion(usa, region, redirect ? name + ' \u2192 ' + region.name : name);
}

// ── Polygon rebuild ─────────────────────────────────────────────
let _origGeoJSON = null;

function rebuildPolygons(projFn) {
  if (!_origGeoJSON) return;
  if (statesLayer) map.removeLayer(statesLayer);
  const clone = JSON.parse(_origGeoJSON);
  for (const f of clone.features) {
    let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
    (function walk(c){if(typeof c[0]==='number'){const lng=c[0],lat=c[1];
      if(lat<minLat)minLat=lat;if(lat>maxLat)maxLat=lat;if(lng<minLng)minLng=lng;if(lng>maxLng)maxLng=lng;
      const[py,px]=projFn(lng,lat);c[0]=px;c[1]=py;
    }else{for(const x of c)walk(x);}})(f.geometry.coordinates);
    f.properties._geoBounds={minLat,maxLat,minLng,maxLng};
  }
  statesLayer = L.geoJSON(clone, {
    coordsToLatLng: c => L.latLng(c[1], c[0]),
    pane: 'hitPane',
    style: defaultStyle,
    onEachFeature: bindFeatureInteraction
  }).addTo(map);
}

// ── Load radar (main entry) ─────────────────────────────────────
async function loadRadar(prefetched, restore) {
  const request = ++selectionRequest;
  const { group, region, name } = currentSelection;
  if (displayedImagery && displayedImagery.requestedRegion !== region) {
    clearWorldImagery();
    clearRegionBorders();
    if (nationalOverlay) map.removeLayer(nationalOverlay);
    if (stateOverlay) map.removeLayer(stateOverlay);
    nationalOverlay = null;
    stateOverlay = null;
    displayedImagery = null;
    if (group !== usa) removeStateHitAreas();
  }
  setRegionTitle(worldLocation || name, displayedImagery?.type || region.type);
  showLoading();
  setStatus('Loading ' + name + '...');

  const result = prefetched || await fetchRadarGif(region, animated, request);
  if (group === usa) await geoReady;
  if (!result || request !== selectionRequest) return;
  hideLoading();

  if (result.url) {
    const actual = result.displayedRegion;
    const worldView = isWorldMosaic(actual);
    const sameView = displayedImagery?.displayedRegion === actual && (worldView || displayedImagery.type === result.type);
    if (worldView) {
      removeStateHitAreas();
      setWorldImagery(result.url);
    } else if (group !== usa || result.type !== 'radar') {
      setUnprojectedImagery(result.url, actual, result.type);
    } else if (actual === conus) {
      setNationalRadar(result.url);
    } else if (actual.state) {
      setStateRadar(result.url, actual.key);
    } else {
      setRegionRadar(result.url, actual.key);
    }
    if (worldView && restore) {
      worldLocation = restore.location;
      updateWorldButtons();
      map.setView(restore.center, restore.zoom, { animate:false });
    } else if (!sameView) {
      const bounds = imageryBounds(actual);
      if (worldView) map.fitBounds(bounds, { animate:false, ...getMapFitPadding() });
      else map.flyToBounds(bounds, { duration:0.5, ...getMapFitPadding() });
    }
    displayedImagery = { requestedRegion:region, displayedRegion:actual, type:result.type };
    setRegionTitle(worldLocation || name, result.type);
    const age = result.cached ? 'cached' : 'downloaded';
    const note = actual !== region ? ' (Showing ' + actual.name + ')'
      : (result.type === 'sat_ir' ? ' (Standard IR)' : '');
    setStatus(name + ' \u00b7 ' + age + ' \u00b7 ' + fmtTime(result.time) + note);
  } else {
    setStatus(result.error || 'Error');
  }
  updateCacheStatus();
}

// ── GeoJSON loading (replaces C# InjectPostalCodes) ─────────────
async function initGeoJSON() {
  try {
    if (window.__US_STATES_GEOJSON__) {
      const geo = window.__US_STATES_GEOJSON__;
      for (const f of geo.features) {
        const name = f.properties && f.properties.name;
        if (name && NameToAbbrev[name]) f.properties.STUSPS = NameToAbbrev[name];
      }
      _origGeoJSON = JSON.stringify(geo);
      rebuildPolygons(geoToPixel);
      initSubRegionBounds();
      if (currentSelection.group !== usa) removeStateHitAreas();
      return;
    }

    const geoURL = new URL('us-states.geo.json', window.location.href).toString();
    const resp = await fetch(geoURL);
    if (!resp.ok) { setStatus('GeoJSON load failed: HTTP ' + resp.status); return; }
    const geo = await resp.json();
    // Inject STUSPS postal codes from state name
    for (const f of geo.features) {
      const name = f.properties && f.properties.name;
      if (name && NameToAbbrev[name]) f.properties.STUSPS = NameToAbbrev[name];
    }
    _origGeoJSON = JSON.stringify(geo);
    rebuildPolygons(geoToPixel);
    initSubRegionBounds();
    if (currentSelection.group !== usa) removeStateHitAreas();
  } catch(e) { setStatus('GeoJSON error: ' + e.message); }
}

// ── Boot ────────────────────────────────────────────────────────
buildRegionButtons();
const geoReady = initGeoJSON();
loadRadar();
</script>
